name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - run: ./build.ps1
      - run: cargo test --manifest-path launcher/Cargo.toml -p artcraft-launcher-ui-egui --test jirka -- --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: JirkaStore-Windows
          path: dist/windows/
